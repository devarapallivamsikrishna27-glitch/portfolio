  <text x="888" y="534" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">TX-98395 • $42.50</text>
  <text x="888" y="554" fill="#94A3B8" font-family="sans-serif" font-size="11">Card #•••• 3190 | Verified 3D-Secure</text>
  <rect x="1130" y="526" width="76" height="24" rx="12" fill="#065F46" />
