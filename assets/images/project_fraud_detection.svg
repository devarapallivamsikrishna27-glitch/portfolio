  <text x="888" y="454" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">TX-98399 • $680.00</text>
  <text x="888" y="474" fill="#94A3B8" font-family="sans-serif" font-size="11">Card #•••• 4209 | Rapid Velocity Alert</text>
  <rect x="1130" y="446" width="76" height="24" rx="12" fill="#78350F" />
  <text x="1144" y="462" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="700">REVIEW</text>

  <!-- Transaction item 3 -->
  <rect x="835" y="510" width="385" height="68" rx="12" fill="#0f172a" stroke="#10B981" stroke-width="1" />
  <circle cx="862" cy="544" r="14" fill="#064e3b" />
