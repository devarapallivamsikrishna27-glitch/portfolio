  <text x="96" y="68" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20">FraudGuard AI <tspan fill="#94A3B8" font-weight="400" font-size="14">| Transaction Risk &amp; Anomaly Detection</tspan></text>
  
  <rect x="920" y="46" width="120" height="32" rx="16" fill="#064E3B" stroke="#059669" stroke-width="1" />
  <circle cx="936" cy="62" r="4" fill="#10B981" />
