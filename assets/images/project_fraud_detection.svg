  <text x="369" y="196" fill="#F8FAFC" font-family="sans-serif" font-size="34" font-weight="700">284,520</text>
  <text x="369" y="222" fill="#06B6D4" font-family="sans-serif" font-size="12" font-weight="500">⚡ Latency &lt; 14ms / event</text>

